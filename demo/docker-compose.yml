version: "3.8"

services:
  db:
    image: postgres:15
    container_name: citas_db
    environment:
      POSTGRES_DB: citas_medicas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./src/main/resources/db/citas_medicas.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    container_name: citas_backend
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/citas_medicas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8081"

  frontend:
    build: ../frontend
    container_name: citas_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
